plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.40.0")
    implementation("org.testng:testng:7.11.0")
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
    implementation("ch.qos.logback:logback-classic:1.6.3")
    implementation("org.assertj:assertj-core:3.27.5")
    testRuntimeOnly 'org.apache-extras.beanshell:bsh:2.0b6'
}

test {
    useTestNG()
}

def registerTask(String taskName, String suitePath){
    tasks.register(taskName, Test){
        outputs.upToDateWhen { false }

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useTestNG(){
            suites suitePath
        }
        if(project.hasProperty('browser')){
            systemProperty 'browser', "${browser}"
        }
    }
}
registerTask('smoke', 'src/test/resources/smoke.xml')
registerTask('regr', 'src/test/resources/regression.xml')
registerTask('header', 'src/test/resources/header.xml')
registerTask('headerMin', 'src/test/resources/headerMin.xml')
registerTask('footer', 'src/test/resources/footer.xml')

task qa (type: Test){
    useTestNG()
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    if(project.hasProperty('browser')){
        inputs.property "browser", project.property('browser')
        systemProperty 'browser', "${browser}"
    }
}

